name: beruang_bijak
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  uuid: ^4.6.0
  intl: 0.19.0
  sqflite: ^2.4.2
  path: ^1.9.1
  fl_chart: 0.69.0
  shared_preferences: ^2.5.3
  sqflite_common_ffi: ^2.3.6
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.jpeg"
  image_path: "assets/images/app_logo.jpeg" # <-- Sesuaikan dengan path gambar logomu
  min_sdk_android: 21